name: Tests                          # just a label — shows up in GitHub's Actions tab

on:
  push:
    branches: [main]                 # run this whenever you push to main
  pull_request:
    branches: [main]                 # also run it on any PR targeting main

jobs:
  test:
    runs-on: macos-latest            # ← the one non-obvious line: WHY macOS specifically

    steps:
      - uses: actions/checkout@v4    # step 1: get your repo's code onto the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # step 2: install Python 3.11 (matches your local env)

      - name: Install package
        run: pip install -e .        # step 3: same command you run locally

      - name: Run tests
        run: pytest tests -v         # step 4: same command you run locally
